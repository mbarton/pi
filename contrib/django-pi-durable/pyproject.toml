[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "django-pi-durable"
version = "0.1.0"
description = "Django storage backend for pi-durable Sessions"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Django>=4.2"]

[tool.setuptools.packages.find]
include = ["pi_durable*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["B", "SIM", "RUF"]
# Django declares options as mutable class attributes.
ignore = ["RUF012"]
